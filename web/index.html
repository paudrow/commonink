<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Common Ink</title>
    <meta name="description" content="Notes and files for you, your team, and your agents." />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta property="og:title" content="Common Ink" />
    <meta property="og:description" content="Notes and files for you, your team, and your agents." />
    <meta property="og:image" content="https://commonink.app/social.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      try {
        const t = localStorage.getItem("quire.theme");
        if (t) document.documentElement.dataset.theme = t;
      } catch {}
    </script>
  </head>
  <body>
    <div id="app">
      <aside id="sidebar">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true"></span>
          <div class="brand-text"><strong>Common Ink</strong><span id="vault-name">&nbsp;</span></div>
        </div>
        <button id="search-btn" class="search-pill" type="button">
          <span class="ico" data-icon="search"></span><span>Search notes</span><kbd>⌘K</kbd>
        </button>
        <button id="notes-btn" class="nav-item" type="button"><span class="ico" data-icon="feed"></span><span>Notes</span></button>
        <button id="tasks-btn" class="nav-item" type="button"><span class="ico" data-icon="task"></span><span>Tasks</span><span id="tasks-count" class="n"></span></button>
        <button id="assets-btn" class="nav-item" type="button"><span class="ico" data-icon="grid"></span><span>Assets</span><span id="assets-count" class="n"></span></button>
        <button id="history-btn" class="nav-item" type="button"><span class="ico" data-icon="history"></span><span>History</span></button>
        <div class="sidebar-sections">
        <div class="tree-head" data-section="favorites">
          <button class="section-toggle" type="button" aria-expanded="true" aria-controls="favorites"><span class="ico" data-icon="chevron" data-size="12"></span><span>Favorites</span></button>
        </div>
        <nav id="favorites" aria-label="Favorites"></nav>
        <div class="tree-head" data-section="smart">
          <button class="section-toggle" type="button" aria-expanded="true" aria-controls="smart-folders"><span class="ico" data-icon="chevron" data-size="12"></span><span>Smart folders</span></button>
          <button id="new-smart-folder" class="icon-btn small" type="button" title="New smart folder"><span class="ico" data-icon="plus" data-size="15"></span></button>
        </div>
        <nav id="smart-folders" aria-label="Smart folders"></nav>
        <div class="tree-head" data-section="folders">
          <button class="section-toggle" type="button" aria-expanded="true" aria-controls="tree"><span class="ico" data-icon="chevron" data-size="12"></span><span>Folders</span></button>
          <button id="new-folder" class="icon-btn small" type="button" title="New folder"><span class="ico" data-icon="folderPlus" data-size="15"></span></button>
        </div>
        <nav id="tree" aria-label="Folders"></nav>
        <div class="tree-head" data-section="tags">
          <button class="section-toggle" type="button" aria-expanded="true" aria-controls="tag-tree"><span class="ico" data-icon="chevron" data-size="12"></span><span>Tags</span></button>
          <button id="tags-page-btn" class="icon-btn small" type="button" title="Rename and merge tags"><span class="ico" data-icon="sliders" data-size="15"></span></button>
        </div>
        <nav id="tag-tree" aria-label="Tags"></nav>
        </div>
        <div class="sidebar-foot">
          <button id="archive-nav" class="nav-item" type="button"><span class="ico" data-icon="archive"></span><span>Archive</span><span id="archive-count" class="n"></span></button>
          <button id="new-note" class="ghost-btn" type="button"><span class="ico" data-icon="plus"></span>New note</button>
        </div>
      </aside>

      <main id="main">
        <header id="topbar">
          <button id="back-btn" class="back-btn" type="button" title="Back to notes" hidden><span class="ico" data-icon="back"></span><span>Notes</span></button>
          <div id="crumbs"></div>
          <div class="spacer"></div>
          <div id="agents" title="Agents active in the last 15 minutes"></div>
          <div id="save-status" aria-live="polite"></div>
          <div id="html-toggle" class="seg" hidden>
            <button data-mode="preview" type="button">Preview</button><button data-mode="source" type="button">Source</button>
          </div>
          <button id="star-btn" class="icon-btn" type="button" title="Star (add to Favorites)"><span class="ico" data-icon="star"></span></button>
          <button id="note-history-btn" class="icon-btn" type="button" title="History of this note"><span class="ico" data-icon="history"></span></button>
          <button id="move-btn" class="icon-btn" type="button" title="Move to folder"><span class="ico" data-icon="move"></span></button>
          <button id="archive-btn" class="icon-btn" type="button" title="Archive note (⌘⇧E)"><span class="ico" data-icon="archive"></span></button>
          <button id="split-btn" class="icon-btn" type="button" title="Split view (⌘⌥\)"><span class="ico" data-icon="split"></span></button>
          <button id="focus-btn" class="icon-btn" type="button" title="Focus mode (⌘⇧↵)"><span class="ico" data-icon="focus"></span></button>
          <button id="panel-btn" class="icon-btn" type="button" title="Toggle side panel (⌘\)"><span class="ico" data-icon="panel"></span></button>
        </header>
        <div id="banner" hidden></div>
        <div id="stage">
          <div id="main-bar" class="pane-bar" hidden></div>
          <div id="editor-host"></div>
          <div id="html-preview" hidden></div>
          <div id="notes-view" hidden tabindex="-1"></div>
          <div id="tasks-view" hidden tabindex="-1"></div>
          <div id="history-view" hidden tabindex="-1"></div>
          <div id="assets-view" hidden tabindex="-1"></div>
          <div id="tags-view" hidden tabindex="-1"></div>
          <div id="pane-divider" role="separator" aria-orientation="vertical" aria-label="Resize the panes" tabindex="0" hidden></div>
          <section id="side-pane" aria-label="Side pane" hidden>
            <div id="side-bar" class="pane-bar"></div>
            <div id="side-host"></div>
            <div id="side-preview" hidden></div>
          </section>
          <div id="side-drop" hidden><span class="ico" data-icon="split"></span>Open to the side</div>
        </div>
        <footer id="statusbar">
          <span id="vim-mode" class="mode"></span>
          <span id="cursor-pos"></span>
          <span id="word-count"></span>
          <span class="spacer"></span>
          <span id="conn" class="conn"></span>
          <button id="vim-toggle" class="chip-btn" type="button" title="Vim keybindings in the editor" aria-pressed="false">Vim keys: off</button>
          <button id="theme-toggle" class="icon-btn small" type="button" title="Toggle theme"><span class="ico" data-icon="moon"></span></button>
        </footer>
      </main>

      <aside id="panel">
        <section>
          <h3>Outline</h3>
          <div id="outline" class="panel-list"></div>
        </section>
        <section>
          <h3>Backlinks <span id="backlink-count" class="count"></span></h3>
          <div id="backlinks" class="panel-list"></div>
        </section>
        <section class="grow">
          <h3>Activity</h3>
          <div id="activity" class="panel-list"></div>
        </section>
      </aside>
    </div>

    <div id="palette" hidden>
      <div class="palette-box" role="dialog" aria-label="Search notes">
        <div class="palette-input"><span class="ico" data-icon="search"></span><input id="palette-input" placeholder="Search or jump to a note…" autocomplete="off" spellcheck="false" /></div>
        <div id="palette-results" role="listbox"></div>
        <div class="palette-foot"><span><kbd>↑</kbd><kbd>↓</kbd> move</span><span><kbd>↵</kbd> open</span><span><kbd class="palette-side">⌘↵</kbd> open to the side</span><span><kbd>⇧↵</kbd> create</span><span><kbd>esc</kbd> close</span></div>
      </div>
    </div>
    <div id="toasts"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
