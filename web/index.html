<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Common Ink</title>
    <meta name="description" content="Notes and files for you, your team, and your agents." />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta property="og:title" content="Common Ink" />
    <meta property="og:description" content="Notes and files for you, your team, and your agents." />
    <meta property="og:image" content="https://commonink.app/social.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      try {
        // This browser's settings were under the legacy prefix before the rename: move them, once.
        const legacy = "quire."; // legacy prefix
        for (const k of Object.keys(localStorage)) {
          if (!k.startsWith(legacy)) continue;
          const now = "commonink." + k.slice(legacy.length);
          if (localStorage.getItem(now) === null) localStorage.setItem(now, localStorage.getItem(k));
          localStorage.removeItem(k);
        }
      } catch {}
      try {
        const t = localStorage.getItem("commonink.theme");
        if (t) document.documentElement.dataset.theme = t;
        // The ink you picked in Settings (web/src/inks.ts), so the page draws in it from the start.
        const ink = localStorage.getItem("commonink.ink");
        if (ink) document.documentElement.dataset.ink = ink;
      } catch {}
    </script>
  </head>
  <body>
    <div id="app">
      <aside id="sidebar">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true"></span>
          <div class="brand-text"><strong>Common Ink</strong><span id="vault-name">&nbsp;</span></div>
        </div>
        <button id="search-btn" class="search-pill" type="button">
          <span class="ico" data-icon="search"></span><span>Search notes</span><kbd data-keys="Mod-k">⌘K</kbd>
        </button>
        <button id="notes-btn" class="nav-item" type="button"><span class="ico" data-icon="feed"></span><span>Notes</span></button>
        <button id="tasks-btn" class="nav-item" type="button"><span class="ico" data-icon="task"></span><span>Tasks</span><span id="tasks-count" class="n"></span></button>
        <button id="contacts-btn" class="nav-item" type="button" hidden><span class="ico" data-icon="user"></span><span>Contacts</span></button>
        <button id="calendar-btn" class="nav-item" type="button" hidden><span class="ico" data-icon="calendar"></span><span>Calendar</span></button>
        <button id="assets-btn" class="nav-item" type="button" hidden><span class="ico" data-icon="grid"></span><span>Assets</span><span id="assets-count" class="n"></span></button>
        <button id="history-btn" class="nav-item" type="button"><span class="ico" data-icon="history"></span><span>History</span></button>
        <button id="shared-btn" class="nav-item" type="button" hidden><span class="ico" data-icon="share"></span><span>Shared with me</span><span id="shared-count" class="n"></span></button>
        <div class="sidebar-sections">
        <div class="tree-head" data-section="favorites">
          <button class="section-toggle" type="button" aria-expanded="true" aria-controls="favorites"><span class="ico" data-icon="chevron" data-size="12"></span><span>Favorites</span></button>
        </div>
        <nav id="favorites" aria-label="Favorites"></nav>
        <div class="tree-head" data-section="smart" hidden>
          <button class="section-toggle" type="button" aria-expanded="true" aria-controls="smart-folders"><span class="ico" data-icon="chevron" data-size="12"></span><span>Smart folders</span></button>
          <button id="new-smart-folder" class="icon-btn small" type="button" title="New smart folder" aria-label="New smart folder"><span class="ico" data-icon="plus" data-size="15"></span></button>
        </div>
        <nav id="smart-folders" aria-label="Smart folders" hidden></nav>
        <div class="tree-head" data-section="folders">
          <button class="section-toggle" type="button" aria-expanded="true" aria-controls="tree"><span class="ico" data-icon="chevron" data-size="12"></span><span>Folders</span></button>
          <button id="new-folder" class="icon-btn small" type="button" title="New folder" aria-label="New folder"><span class="ico" data-icon="plus" data-size="15"></span></button>
        </div>
        <nav id="tree" aria-label="Folders"></nav>
        <div class="tree-head" data-section="tags">
          <button class="section-toggle" type="button" aria-expanded="true" aria-controls="tag-tree"><span class="ico" data-icon="chevron" data-size="12"></span><span>Tags</span></button>
          <span class="tree-head-actions">
            <button id="tags-page-btn" class="icon-btn small" type="button" title="Rename and merge tags" aria-label="Rename and merge tags"><span class="ico" data-icon="sliders" data-size="15"></span></button>
            <button id="new-tag" class="icon-btn small" type="button" title="New tag" aria-label="New tag"><span class="ico" data-icon="plus" data-size="15"></span></button>
          </span>
        </div>
        <nav id="tag-tree" aria-label="Tags"></nav>
        </div>
        <div class="sidebar-foot">
          <button id="settings-btn" class="nav-item" type="button" hidden><span class="ico" data-icon="gear"></span><span>Settings</span><kbd class="n">⌘,</kbd></button>
          <div class="new-note-row">
            <button id="new-note" class="ghost-btn" type="button"><span class="ico" data-icon="plus"></span>New note</button>
            <button id="new-from-template" class="icon-btn small" type="button" title="New note from template…" aria-label="New note from template…"><span class="ico" data-icon="file" data-size="15"></span></button>
          </div>
        </div>
      </aside>

      <main id="main">
        <header id="topbar">
          <div class="spacer"></div>
          <div id="agents" title="Agents active in the last 15 minutes"></div>
          <div id="save-status" role="status" aria-live="polite"></div>
          <div id="html-toggle" class="seg" role="group" aria-label="Show as" hidden>
            <button data-mode="preview" type="button">Preview</button><button data-mode="source" type="button">Source</button>
          </div>
          <button id="share-btn" class="icon-btn" type="button" title="Share, print or export" aria-label="Share, print or export" aria-haspopup="menu" aria-expanded="false" hidden><span class="ico" data-icon="share"></span></button>
          <button id="star-btn" class="icon-btn" type="button" title="Star (add to Favorites)" aria-label="Star (add to Favorites)"><span class="ico" data-icon="star"></span></button>
          <button id="note-history-btn" class="icon-btn" type="button" title="History of this note" aria-label="History of this note"><span class="ico" data-icon="history"></span></button>
          <button id="move-btn" class="icon-btn" type="button" title="Move to another folder" aria-label="Move to another folder"><span class="ico" data-icon="move"></span></button>
          <button id="archive-btn" class="icon-btn" type="button" title="Archive note (⌘⇧E)" aria-label="Archive note (⌘⇧E)"><span class="ico" data-icon="archive"></span></button>
          <button id="delete-btn" class="icon-btn" type="button" title="Delete note (to Trash)" aria-label="Delete note (to Trash)"><span class="ico" data-icon="trash"></span></button>
          <button id="split-btn" class="icon-btn" type="button" title="Split view (⌘⌥\)" aria-label="Split view (⌘⌥\)"><span class="ico" data-icon="split"></span></button>
          <button id="focus-btn" class="icon-btn" type="button" title="Focus mode (⌘⇧↵)" aria-label="Focus mode (⌘⇧↵)"><span class="ico" data-icon="focus"></span></button>
          <button id="panel-btn" class="icon-btn" type="button" title="Toggle side panel (⌘\)" aria-label="Toggle side panel (⌘\)"><span class="ico" data-icon="panel"></span></button>
        </header>
        <div id="stage">
          <div id="main-bar" class="pane-bar" hidden></div>
          <div id="banner" class="banner" hidden></div>
          <div id="editor-host"></div>
          <div id="html-preview" hidden></div>
          <div id="notes-view" hidden tabindex="-1"></div>
          <div id="tasks-view" hidden tabindex="-1"></div>
          <div id="calendar-view" hidden tabindex="-1"></div>
          <div id="history-view" hidden tabindex="-1"></div>
          <div id="assets-view" hidden tabindex="-1"></div>
          <div id="tags-view" hidden tabindex="-1"></div>
          <div id="contacts-view" hidden tabindex="-1"></div>
          <div id="shared-view" hidden tabindex="-1"></div>
          <div id="capture-view" hidden tabindex="-1"></div>
          <div id="pane-divider" role="separator" aria-orientation="vertical" aria-label="Resize the panes" tabindex="0" hidden></div>
          <section id="side-pane" aria-label="Side pane" hidden>
            <div id="side-bar" class="pane-bar"></div>
            <div id="side-banner" class="banner" hidden></div>
            <div id="side-host"></div>
            <div id="side-preview" hidden></div>
          </section>
          <div id="side-drop" hidden><span class="ico" data-icon="split"></span>Open to the side</div>
        </div>
        <footer id="statusbar">
          <span id="vim-mode" class="mode"></span>
          <span id="cursor-pos"></span>
          <span id="word-count"></span>
          <span class="spacer"></span>
          <span id="conn" class="conn" role="status" title="Connecting to the server…" aria-label="Connecting to the server…"></span>
          <button id="codewrap-toggle" class="chip-btn" type="button" aria-pressed="false" hidden>Wrap code: on</button>
          <button id="vim-toggle" class="chip-btn" type="button" title="Vim keybindings in the editor" aria-pressed="false" hidden>Vim keys: off</button>
          <button id="theme-toggle" class="icon-btn small" type="button" title="Toggle theme" aria-label="Toggle theme"><span class="ico" data-icon="moon"></span></button>
        </footer>
      </main>

      <aside id="panel">
        <section>
          <h3>Outline</h3>
          <div id="outline" class="panel-list"></div>
        </section>
        <section>
          <h3>Backlinks <span id="backlink-count" class="count"></span></h3>
          <div id="backlinks" class="panel-list"></div>
        </section>
        <section class="grow">
          <h3>Activity</h3>
          <div id="activity" class="panel-list"></div>
        </section>
      </aside>
    </div>

    <div id="palette" hidden>
      <div class="palette-box" role="dialog" aria-modal="true" aria-label="Search notes and commands">
        <div class="palette-input"><span class="ico" data-icon="search"></span><input id="palette-input" role="combobox" aria-label="Search notes and commands" aria-controls="palette-results" aria-expanded="true" aria-autocomplete="list" placeholder="Find a note, or type > for commands…" autocomplete="off" spellcheck="false" /></div>
        <div id="palette-results" role="listbox" aria-label="Results"></div>
        <div class="palette-foot"><span><kbd data-keys="ArrowUp">↑</kbd><kbd data-keys="ArrowDown">↓</kbd> move</span><span><kbd data-keys="Enter">↵</kbd> open</span><span><kbd data-keys="Mod-Enter">⌘↵</kbd> open to the side</span><span><kbd data-keys="Shift-Enter">⇧↵</kbd> create</span><span><kbd data-keys="Mod-p">⌘P</kbd> notes</span><span><kbd data-keys="Mod-Shift-p">⌘⇧P</kbd> or <kbd data-keys="&gt;">&gt;</kbd> commands</span><span><kbd data-keys="Escape">Esc</kbd> close</span></div>
      </div>
    </div>
    <div id="toasts" role="region" aria-label="Notifications"></div>
    <div id="toast-status" class="sr-only" role="status"></div>
    <div id="toast-alert" class="sr-only" role="alert"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
